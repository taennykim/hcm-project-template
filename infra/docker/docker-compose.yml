services:
  web:
    build:
      context: ../../apps/web
    container_name: hcm-web
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "${WEB_PORT}"
    networks:
      - hcm-net

  api:
    build:
      context: ../../apps/api
    container_name: hcm-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    expose:
      - "${API_PORT}"
    networks:
      - hcm-net

  db:
    image: postgres:16-alpine
    container_name: hcm-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - hcm-postgres-data:/var/lib/postgresql/data
    networks:
      - hcm-net

  mock-server:
    build:
      context: ../../mock-server
    container_name: hcm-mock-server
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "${MOCK_SERVER_PORT}"
    networks:
      - hcm-net

  nginx:
    image: nginx:1.27-alpine
    container_name: hcm-nginx
    restart: unless-stopped
    depends_on:
      - web
      - api
      - mock-server
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - hcm-net

networks:
  hcm-net:
    driver: bridge

volumes:
  hcm-postgres-data:
