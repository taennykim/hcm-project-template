services:
  web:
    build:
      context: ../../apps/web
    container_name: hcm-web
    restart: unless-stopped
    command: ["npm", "run", "start"]
    env_file:
      - .env
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
    expose:
      - "${WEB_PORT}"
    networks:
      - hcm-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build:
      context: ../../apps/api
    container_name: hcm-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    expose:
      - "${API_PORT}"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - hcm-net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  db:
    image: postgres:16-alpine
    container_name: hcm-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - hcm-postgres-data:/var/lib/postgresql/data
    networks:
      - hcm-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  mock-server:
    build:
      context: ../../mock-server
    container_name: hcm-mock-server
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "${MOCK_SERVER_PORT}"
    networks:
      - hcm-net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from urllib.request import urlopen; urlopen('http://127.0.0.1:9000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  nginx:
    image: nginx:1.27-alpine
    container_name: hcm-nginx
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
      mock-server:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - hcm-net

networks:
  hcm-net:
    driver: bridge

volumes:
  hcm-postgres-data:
